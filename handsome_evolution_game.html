<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帅哥照片进化游戏</title>
<style>
:root{--bg:#100f1d;--panel:#1c1a2e;--pink:#ff72b6;--gold:#ffd879;--text:#f8f5ff;--muted:#b9b5cf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#34204c 0,#171326 42%,#0e0d18 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:20px}
.app{width:min(100%,720px)}header{text-align:center;margin:6px 0 18px}h1{font-size:clamp(25px,5vw,36px);margin:0 0 6px;letter-spacing:.5px}header p{margin:0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.stat{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:15px;padding:11px;text-align:center}.stat b{display:block;font-size:21px;color:var(--gold)}.stat span{font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.hero{background:linear-gradient(145deg,#28213c,#191629);border:1px solid #ffffff20;border-radius:24px;padding:15px;box-shadow:0 18px 45px #0005}
.photo-wrap{position:relative;margin:auto;width:min(100%,370px);height:390px;border-radius:19px;overflow:hidden;background:#0b0a12;border:1px solid #ffffff20}.photo-wrap img{width:100%;height:100%;object-fit:contain;display:block;transition:filter .35s}.locked-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0b0a12d9;text-align:center;gap:8px}.locked-overlay .lock{font-size:48px}.locked-overlay p{margin:0;color:var(--muted);padding:0 20px}.level-pill{position:absolute;top:12px;left:12px;border-radius:99px;padding:6px 11px;background:#11101dcc;border:1px solid #ffffff33;font-size:12px;font-weight:700}
.info{text-align:center;padding:14px 4px 2px}.eyebrow{font-size:12px;color:var(--pink);font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.info h2{margin:5px 0;font-size:23px}.info p{margin:0;color:var(--muted);font-size:13px}
.xp-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:14px 2px 7px}.bar{height:10px;background:#0d0c16;border-radius:99px;overflow:hidden;border:1px solid #ffffff12}.bar-fill{height:100%;width:0;background:linear-gradient(90deg,#ff72b6,#ffd879);border-radius:99px;transition:width .35s}
.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:14px;padding:13px 12px;font-weight:800;font-size:14px;cursor:pointer;transition:transform .12s,opacity .12s}.btn:active{transform:scale(.98)}.primary{flex:1;background:linear-gradient(100deg,#ff72b6,#ff9dca);color:#241027;box-shadow:0 6px 18px #ff72b633}.secondary{background:#ffffff12;color:var(--text);border:1px solid #ffffff24}.btn:disabled{opacity:.38;cursor:not-allowed}
.collection{background:#ffffff08;border:1px solid #ffffff18;border-radius:20px;padding:14px}.collection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.collection h3{margin:0;font-size:16px}.collection small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid #ffffff22;background:#141220;cursor:pointer;padding:0;color:white}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile .shade{position:absolute;inset:0;background:#09081288;display:flex;align-items:center;justify-content:center;font-size:22px}.tile.unlocked{border-color:#ff72b6aa}.tile .num{position:absolute;left:6px;top:6px;background:#100f1ddd;padding:3px 6px;border-radius:7px;font-size:10px}.tile .check{position:absolute;right:6px;top:5px;color:#ffe18c;text-shadow:0 1px 4px #000;font-weight:900}
.note{font-size:11px;color:#a9a4bd;text-align:center;line-height:1.5;margin:12px 4px 0}
@media(max-width:420px){body{padding:12px}.photo-wrap{height:340px}.grid{gap:6px}.tile{border-radius:9px}.hero{padding:11px}}
</style>
</head>
<body>
<div class="app">
<header><h1>✨ 帅哥照片进化 ✨</h1><p>收集照片 · 累积经验 · 一步步解锁新形态</p></header>
<div class="stats">
<div class="stat"><b id="levelStat">Lv. 1</b><span>当前等级</span></div>
<div class="stat"><b id="xpStat">0</b><span>进化经验 XP</span></div>
<div class="stat"><b id="unlockedStat">1 / 8</b><span>已解锁照片</span></div>
</div>
<div class="main">
<section class="hero">
<div class="photo-wrap">
<img id="heroImg" alt="当前解锁的照片">
<div class="level-pill" id="pill">LEVEL 1</div>
<div class="locked-overlay" id="overlay"><div class="lock">🔒</div><strong>尚未解锁</strong><p>继续积累经验，解锁这张照片！</p></div>
</div>
<div class="info"><div class="eyebrow" id="eyebrow">STARTER FORM</div><h2 id="heroTitle">初始形态 · 侧脸</h2><p id="heroDesc">你的收集之旅开始啦！</p></div>
<div class="xp-row"><span>进化进度</span><span id="xpText">0 / 100 XP</span></div>
<div class="bar"><div class="bar-fill" id="barFill"></div></div>
<div class="actions">
<button class="btn secondary" id="prevBtn">← 上一形态</button>
<button class="btn primary" id="evolveBtn">⚡ 获取经验</button>
<button class="btn secondary" id="nextBtn">下一形态 →</button>
</div>
</section>
<section class="collection">
<div class="collection-head"><h3>📸 形态图鉴</h3><small>点击已解锁的照片查看</small></div>
<div class="grid" id="grid"></div>
</section>
</div>
<p class="note">玩法：点击「获取经验」累积 XP；每达到 100 XP 就能解锁下一张照片。也可以点击图鉴查看已解锁的形态。进度仅保存在本次打开的游戏页面中。</p>
</div>

let xp = 0, unlocked = 1, current = 0;
const $ = id => document.getElementById(id);
function render(){
  $("heroImg").src = cards[current].img;
  $("heroImg").style.filter = current < unlocked ? "none" : "brightness(.18) blur(2px)";
  $("overlay").style.display = current < unlocked ? "none" : "flex";
  $("pill").textContent = "LEVEL " + (current + 1);
  $("heroTitle").textContent = current < unlocked ? cards[current].title : "神秘形态";
  $("eyebrow").textContent = current < unlocked ? ["STARTER FORM","MIRROR FORM","STYLE MASTER","WINDOW FORM","NIGHT PLAYER","BEACH FORM","CLOSE-UP FORM","FINAL FORM"][current] : "LOCKED";
  $("heroDesc").textContent = current < unlocked ? (current === 7 ? "全部形态已集齐！你完成了进化之旅。" : "形态已解锁，继续收集更多照片吧！") : "还差一些经验就能见到新形态。";
  $("levelStat").textContent = "Lv. " + unlocked;
  $("xpStat").textContent = xp;
  $("unlockedStat").textContent = unlocked + " / " + cards.length;
  const progress = unlocked === cards.length ? 100 : xp % 100;
  $("xpText").textContent = unlocked === cards.length ? "MAX LEVEL" : progress + " / 100 XP";
  $("barFill").style.width = progress + "%";
  $("prevBtn").disabled = current === 0;
  $("nextBtn").disabled = current >= unlocked - 1;
  $("evolveBtn").textContent = unlocked === cards.length ? "🏆 已全部解锁" : "⚡ 获取经验";
  $("evolveBtn").disabled = unlocked === cards.length;
  $("grid").innerHTML = "";
  cards.forEach((c,i)=>{
    const b=document.createElement("button"); b.className="tile"+(i<unlocked?" unlocked":"");
    b.setAttribute("aria-label",i<unlocked?c.title:"锁定形态");
    const im=document.createElement("img"); im.src=c.img; im.alt="";
    if(i>=unlocked) im.style.filter="brightness(.25) blur(1px)";
    b.appendChild(im);
    const n=document.createElement("span");n.className="num";n.textContent="LV."+ (i+1);b.appendChild(n);
    if(i>=unlocked){const s=document.createElement("span");s.className="shade";s.textContent="🔒";b.appendChild(s);}
    else if(i===current){const s=document.createElement("span");s.className="check";s.textContent="✓";b.appendChild(s);}
    b.onclick=()=>{if(i<unlocked){current=i;render();}};
    $("grid").appendChild(b);
  });
}
$("evolveBtn").onclick=()=>{
 if(unlocked>=cards.length)return;
 xp+=25;
 if(xp>=100){xp-=100;unlocked++;current=unlocked-1;}
 render();
};
$("prevBtn").onclick=()=>{if(current>0){current--;render();}};
$("nextBtn").onclick=()=>{if(current<unlocked-1){current++;render();}};
render();
</script>
